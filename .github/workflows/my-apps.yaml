name: Build My Apps

# Personal addition to this fork: builds every app described in my-apps/*.json
# (or the ones named in the input) for macOS and publishes the DMGs to the
# "my-apps" release so the download links do not expire.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: "Config names in my-apps/ without .json, comma-separated, or 'all'"
        required: true
        default: "all"
      multi_arch:
        description: "Universal binary (Intel + Apple Silicon)"
        type: boolean
        default: false
      pake_ref:
        description: "Pake version to build with: 'release' (latest upstream release tag), or a tag/branch/sha of tw93/Pake"
        required: true
        default: "release"

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-24.04
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: pick
        env:
          WANT: ${{ inputs.apps }}
        run: |
          if [ "$WANT" = "all" ]; then
            names=$(ls my-apps/*.json | xargs -n1 basename | sed 's/\.json$//')
          else
            names=$(printf '%s' "$WANT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$')
          fi
          for n in $names; do
            test -f "my-apps/$n.json" || { echo "::error::my-apps/$n.json not found"; exit 1; }
          done
          echo "apps=$(printf '%s\n' $names | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
      # Build from a tagged upstream release by default, not from whatever
      # unreleased commits happen to be on the branch.
      - id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          WANT_REF: ${{ inputs.pake_ref }}
        run: |
          if [ "$WANT_REF" = "release" ]; then
            WANT_REF=$(gh api repos/tw93/Pake/releases/latest --jq .tag_name)
          fi
          echo "Building with tw93/Pake@$WANT_REF"
          echo "ref=$WANT_REF" >> "$GITHUB_OUTPUT"

  build:
    needs: list
    name: ${{ matrix.app }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.list.outputs.apps) }}
    steps:
      - name: Checkout Pake source
        uses: actions/checkout@v6
        with:
          repository: tw93/Pake
          ref: ${{ needs.list.outputs.ref }}
          persist-credentials: false

      - name: Checkout app configs
        uses: actions/checkout@v6
        with:
          path: _cfg
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build CLI
        run: pnpm run cli:build

      - name: Build App
        timeout-minutes: 40
        env:
          APP: ${{ matrix.app }}
          MULTI_ARCH: ${{ inputs.multi_arch }}
        run: |
          ARGS=(--config "_cfg/my-apps/$APP.json")
          if [ "$MULTI_ARCH" = "true" ]; then ARGS+=(--multi-arch); fi
          node dist/cli.js "${ARGS[@]}"
          ls -la *.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.app }}-macOS
          path: "*.dmg"
          retention-days: 7

  # Separate job so the build (which runs third-party build code) only ever
  # holds a read-only token; only this job can write to the release.
  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          pattern: "*-macOS"
          merge-multiple: true
      - name: Publish to my-apps release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release view my-apps -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create my-apps -R "$GITHUB_REPOSITORY" --title "My Apps" \
              --notes "Personal Pake builds from my-apps/*.json" --latest=false
          gh release upload my-apps out/*.dmg -R "$GITHUB_REPOSITORY" --clobber
